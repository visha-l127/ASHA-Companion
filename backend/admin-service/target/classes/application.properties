spring.application.name=admin-service

server.port=8083

# ==============================
# Eureka
# ==============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=3
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=3
eureka.instance.lease-expiration-duration-in-seconds=10

# ==============================
# Database Configuration
# ==============================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=ASHA
spring.datasource.password=ASHA
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.hibernate.ddl-auto=update

# ==============================
# JWT Configuration
# ==============================
jwt.secret=development-secret-change-me-must-be-at-least-thirty-two-bytes-long
jwt.expiration=3600000