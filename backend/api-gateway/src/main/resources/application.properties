spring.application.name=api-gateway

server.port=8081

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=3
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.lease-renewal-interval-in-seconds=3
eureka.instance.lease-expiration-duration-in-seconds=10

# Spring Cloud Gateway Server MVC Routes

# 0. User Profile endpoint (Auth Service)
spring.cloud.gateway.server.webmvc.routes[0].id=user-profile-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/profile

